# Признаки региональной новости. Тег «Законодательство: регионы» ставится,
# только если у новости есть тег «Законодательство» И одно из этих слов.
regional:
  - област
  - край
  - краев
  - республик
  - регион
  - губернатор
  - москв
  - петербург
  - округ

# Стоп-слова: новость с таким словом отбрасывается, даже если у неё есть теги.
exclude:
  - фильм
  - кинофестивал
  - юбилей
  - поздравля
  - телемост
  - слёт
  - слет
  - тургеневские чтения
  - recipe
  - obituary
