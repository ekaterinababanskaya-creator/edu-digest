# Темы (теги) для фильтра EduDigest.
#
# Как это работает: если в заголовке или описании новости встречается
# одно из ключевых слов темы, новость получает этот тег.
# Новости без единого тега попадают в «Прочее» и в сводку не идут.
#
# Как писать ключевые слова:
#   - Достаточно начала слова: «экзамен» найдёт «экзамены», «экзаменационный».
#   - Регистр не важен.
#   - Для коротких английских слов, которые легко спутать с частью другого
#     слова, используй форму «re:\bслово\b». Например, re:\bai\b
#     найдёт «AI», но не «aid».

topics:
  ФГОС:
    - фгос
    - федеральный государственный образовательный стандарт
    - федеральная образовательная программа
    - фоп
    - учебный план
    - учебник
    - школьная программа
    - предметная область
    - curriculum
    - academic standards

  ГИА:
