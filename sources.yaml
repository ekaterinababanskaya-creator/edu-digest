# Источники для EduDigest.
#
# Два вида источников:
#
# 1) Сайт с RSS-лентой — достаточно адреса сайта, ленту приложение найдёт само:
#    - name: Учительская газета
#      url: https://ug.ru
#      region: RU
#      enabled: true
#
# 2) Поиск по новостям — для компаний, ведомств и изданий без удобной ленты.
#    Пишешь запрос, как в поисковике; приложение берёт новости за неделю:
#    - name: Учи.ру
#      search: '"Учи.ру" OR "Uchi.ru"'
#      kind: competitor        # пометка «конкурент» (необязательно)
#      region: RU
#      enabled: true
#
#    Подсказки для запроса: фраза в кавычках ищется целиком; OR — «или»;
#    site:kommersant.ru — только этот сайт.
#
# enabled: false временно отключает источник.

# ================= Конкуренты =================
- name: Онлайн-школа №1
  search: '"Онлайн-школа №1" OR "Онлайн школа №1" OR "Онлайн-школа № 1"'
  kind: competitor
  region: RU
  enabled: true

- name: БИТ
  search: '"онлайн-школа БИТ" OR "онлайн школа БИТ"'
  kind: competitor
  region: RU
  enabled: true

- name: ИнтернетУрок
  search: '"ИнтернетУрок" OR "InternetUrok" OR "Интернет-урок"'
  kind: competitor
  region: RU
  enabled: true

- name: 100балльный репетитор
  search: '"100балльный репетитор" OR "Стобалльный репетитор" OR "100-балльный репетитор"'
  kind: competitor
  region: RU
  enabled: true

- name: Учи.ру
  search: '"Учи.ру" OR "Uchi.ru"'
  kind: competitor
  region: RU
  enabled: true

- name: Тетрика
  search: '"Тетрика" OR "Tetrika"'
  kind: competitor
  region: RU
  enabled: true

- name: Умназия
  search: '"Умназия"'
  kind: competitor
  region: RU
  enabled: true

- name: Skysmart
  search: '"Skysmart" OR "Скайсмарт"'
  kind: competitor
  region: RU
  enabled: true

- name: Онлайн-гимназия №1
  search: '"Онлайн-гимназия №1" OR "Онлайн гимназия №1" OR "Онлайн-гимназия № 1"'
  kind: competitor
  region: RU
  enabled: true

- name: Наши пенаты
  search: '"Наши пенаты" школа'
  kind: competitor
  region: RU
  enabled: true

- name: Феникс
  search: '"онлайн-школа Феникс" OR "школа Феникс" семейное'
  kind: competitor
  region: RU
  enabled: true

# ================= Россия: ведомства =================
- name: Минпросвещения России (поиск)
  search: '"Минпросвещения" OR "Министерство просвещения"'
  region: RU
  enabled: true

- name: Рособрнадзор (поиск)
  search: '"Рособрнадзор"'
  region: RU
  enabled: true

- name: Департамент образования и науки Москвы
  search: '"Департамент образования и науки" Москвы'
  region: RU
  enabled: true

- name: Комитет по образованию Санкт-Петербурга
  search: '"Комитет по образованию" Петербург'
  region: RU
  enabled: true

- name: Минобразования Краснодарского края
  search: '"Министерство образования" "Краснодарского края" OR "минобрнауки Кубани"'
  region: RU
  enabled: true

- name: Минобрнауки Татарстана
  search: '"Министерство образования и науки" Татарстан OR "Минобрнауки РТ"'
  region: RU
  enabled: true

# Прямые сайты ведомств: у первых двух RSS не нашлось, оставлены выключенными
- name: Минпросвещения России
