name: 1. Сбор и фильтр новостей

on:
  workflow_dispatch:   # кнопка «Run workflow» на вкладке Actions

permissions:
  contents: write      # разрешаем сохранять отчёты обратно в репозиторий

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Сбор
        run: python collect.py
      - name: Фильтр и теги
        run: python filter.py
      - uses: actions/upload-artifact@v4
        with:
          name: news
          path: data/
      - name: Сохранить отчёты в репозиторий
        run: |
          git config user.name "edu-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/
          git commit -m "Отчёты о сборе: $(date -u +%Y-%m-%d)" || echo "нет изменений"
          git pull --rebase
          git push
