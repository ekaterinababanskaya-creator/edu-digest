name: 1. Сбор новостей (проверка источников)

on:
  workflow_dispatch:   # кнопка «Run workflow» на вкладке Actions

permissions:
  contents: write      # разрешаем сохранять отчёт обратно в репозиторий

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python collect.py
      - uses: actions/upload-artifact@v4
        with:
          name: items
          path: data/items.json
      - name: Сохранить отчёт в репозиторий
        run: |
          git config user.name "edu-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/sources.md
          git commit -m "Отчёт о сборе: $(date -u +%Y-%m-%d)" || echo "нет изменений"
          git push
